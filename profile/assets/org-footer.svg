<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" role="img" aria-label="Codic Systems — Built to stand" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#01072a"/>
      <stop offset="50%" stop-color="#030d4e"/>
      <stop offset="100%" stop-color="#01072a"/>
    </linearGradient>
    <linearGradient id="frule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12a17a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#12a17a"/>
      <stop offset="100%" stop-color="#12a17a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fclip"><rect width="1000" height="140" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#fclip)">
    <rect width="1000" height="140" fill="url(#fbg)"/>

    <g opacity="0.26">
      <path d="M0 104 Q125 84 250 104 T500 104 T750 104 T1000 104 T1250 104 V140 H0 Z" fill="#12a17a">
        <animateTransform attributeName="transform" type="translate"
          values="0,0; -500,0" dur="15s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.14">
      <path d="M0 112 Q125 130 250 112 T500 112 T750 112 T1000 112 T1250 112 V140 H0 Z" fill="#ffffff">
        <animateTransform attributeName="transform" type="translate"
          values="-500,0; 0,0" dur="21s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect x="300" y="0" width="400" height="2" fill="url(#frule)"/>

    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="500" y="48" fill="#ffffff" font-size="22" font-weight="600" letter-spacing="0.5">
        Built to stand.
      </text>
      <text x="500" y="72" fill="#7e8aab" font-size="12" letter-spacing="1.3">
        CODIC SYSTEMS (SMC-PRIVATE) LIMITED · CUIN 0352637 · NTN J778998 · PSEB REGISTERED
      </text>
      <text x="500" y="90" fill="#5d6a92" font-size="11" letter-spacing="1">
        ISLAMABAD CAPITAL TERRITORY, PAKISTAN
      </text>
    </g>
  </g>
</svg>
