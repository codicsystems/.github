<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Codic Systems — Booking and operations software for travel companies" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061468"/>
      <stop offset="55%" stop-color="#030d4e"/>
      <stop offset="100%" stop-color="#01072a"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12a17a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#12a17a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#12a17a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#12a17a"/>
      <stop offset="100%" stop-color="#12a17a" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#12a17a" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#12a17a" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frame"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <circle cx="500" cy="112" r="230" fill="url(#glow)"/>

    <rect width="300" height="300" fill="url(#sweep)" opacity="0.45">
      <animateTransform attributeName="transform" type="translate"
        values="-340,0; 1120,0" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- ── the mark ──────────────────────────────────────────────────── -->
    <g transform="translate(500 104)">
      <circle r="60" fill="none" stroke="#12a17a" stroke-opacity="0.14" stroke-width="1.5"/>

      <circle r="44" fill="none" stroke="#12a17a" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="207 277">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="15s" repeatCount="indefinite"/>
      </circle>

      <circle r="28" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2.5"
              stroke-linecap="round" stroke-dasharray="112 64">
        <animateTransform attributeName="transform" type="rotate"
          from="360" to="0" dur="10s" repeatCount="indefinite"/>
      </circle>

      <circle r="8.5" fill="#12a17a">
        <animate attributeName="r" values="8.5;10.5;8.5" dur="2.8s" repeatCount="indefinite"/>
      </circle>

      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="7s" repeatCount="indefinite"/>
        <circle cx="44" cy="0" r="5" fill="#ffffff" opacity="0.95"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="200" to="560" dur="11s" repeatCount="indefinite"/>
        <circle cx="60" cy="0" r="3.2" fill="#12a17a"/>
      </g>
    </g>

    <!-- ── type ──────────────────────────────────────────────────────── -->
    <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="500" y="203" fill="#ffffff" font-size="40" font-weight="700" letter-spacing="7.5">
        CODIC SYSTEMS
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.1s" fill="freeze"/>
      </text>

      <rect x="380" y="216" width="240" height="2.5" fill="url(#rule)" opacity="0.9"/>

      <text x="500" y="246" fill="#c3cbe0" font-size="17.5">
        Booking and operations software for travel companies
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.6s" fill="freeze"/>
      </text>

      <!-- rotating capability line -->
      <g font-size="14.5" font-weight="600" fill="#12a17a" letter-spacing="1.6">
        <text x="500" y="276">
          RESERVATION PLATFORMS · QUOTING ENGINES · SUPPLIER INTEGRATIONS
          <animate attributeName="opacity" values="1;1;0;0;0;0;1"
                   dur="12s" begin="2s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="276" opacity="0">
          BACK-OFFICE SYSTEMS · PAYMENTS · DOCUMENT AUTOMATION
          <animate attributeName="opacity" values="0;0;1;1;0;0;0"
                   dur="12s" begin="2s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="276" opacity="0">
          AI WORKFLOWS · n8n · WHATSAPP BUSINESS API · CLAUDE API
          <animate attributeName="opacity" values="0;0;0;0;1;1;0"
                   dur="12s" begin="2s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>

    <!-- corner registration marks -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5d6a92" letter-spacing="1.1">
      <text x="28" y="34">CUIN 0352637</text>
      <text x="972" y="34" text-anchor="end">ISLAMABAD, PAKISTAN</text>
    </g>

    <rect y="297" width="1000" height="3" fill="#12a17a" opacity="0.85"/>
  </g>
</svg>
